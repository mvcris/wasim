version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    ignore:
      # Types must match the Node version CI runs, not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      e2e:
        patterns: ["*"]
