version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        # Local paths come from the operator's own configuration.
        - G304
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - revive

issues:
  # Report every finding: the default cap of 3 per linter hides the rest.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
