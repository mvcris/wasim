<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · wasim console</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1><strong>wasim</strong> <span class="muted">console</span></h1>
      <form id="login-form" class="stack">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required autofocus />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        <p id="login-error" class="login-error" role="alert"></p>
        <button type="submit" class="primary">Log in</button>
      </form>
      <p class="muted small">Users are managed from the command line with <code>wasim user</code>.</p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
